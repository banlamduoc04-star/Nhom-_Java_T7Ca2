server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: moi duong dan khong phai file thi tra index.html
    location / {
        try_files $uri /index.html;
    }

    location ~* \.(js|css|svg|png|webmanifest)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
