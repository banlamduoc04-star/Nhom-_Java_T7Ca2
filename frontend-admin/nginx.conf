server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: moi duong dan khong phai file thi tra index.html.
    # HTML khong duoc cache, neu khong trinh duyet giu giao dien cu sau khi deploy.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    # File Vite co hash trong ten: noi dung khong bao gio doi -> cache lau dai
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(svg|png)$ {
        add_header Cache-Control "no-cache";
    }
}
