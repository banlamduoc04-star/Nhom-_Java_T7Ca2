server:
  port: 8080

spring:
  application:
    name: oism-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/oism_db
    username: postgres
    password: ${DB_PASSWORD:postgres_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# JWT Configuration (FR-AUTH-02)
jwt:
  secret: ${JWT_SECRET:local-dev-only-change-this-secret-32bytes-min}
  expiration: 3600000
