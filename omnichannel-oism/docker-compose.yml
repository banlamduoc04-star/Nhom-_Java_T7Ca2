services:
  postgres:
    image: postgres:16-alpine
    container_name: oism_postgres
    environment:
      POSTGRES_DB: oism_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oism_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oism_backend
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_ADDRESS: 0.0.0.0
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/oism_db
      SPRING_DATASOURCE_USERNAME: postgres
      DB_PASSWORD: postgres_password
      JWT_SECRET: local-dev-only-change-this-secret-32bytes-min
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend-pos:
    build:
      context: ./frontend-pos
      dockerfile: Dockerfile
    container_name: oism_frontend_pos
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  frontend-admin:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile
    container_name: oism_frontend_admin
    ports:
      - "3001:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
