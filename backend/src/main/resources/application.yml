spring:
  application:
    name: oism-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${OISM_DB_URL:jdbc:postgresql://localhost:5432/oism_db}
    username: ${OISM_DB_USER:postgres}
    password: ${OISM_DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate   # schema do Flyway quan ly, khong de Hibernate tu sinh
    open-in-view: true     # TenantFilterAspect dua vao session song suot request
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: always

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never

oism:
  jwt:
    secret: ${OISM_JWT_SECRET:}
    access-ttl-minutes: 60
  cors:
    allowed-origins: ${OISM_CORS_ORIGINS:http://localhost:5173}
  seed:
    enabled: ${OISM_SEED_ENABLED:false}   # true: nap du lieu mau demo (2 tenant, 50 SKU...)

# NFR-USA-01: chi mo /actuator/health (cong khai trong SecurityConfig), khong lo chi tiet thanh phan
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
