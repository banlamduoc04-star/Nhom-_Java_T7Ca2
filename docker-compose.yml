name: oism

# Chay toan he thong: docker compose up -d --build
# Giao dien (React + Vite, nginx) la tuy chon: docker compose --profile frontend up -d --build
# Nap du lieu mau demo: dat OISM_SEED_ENABLED=true (xem docs/huong-dan/huong-dan-chay-du-an.md)
# Chi chay CSDL de dev backend bang IDE: docker compose up -d postgres
services:
  postgres:
    image: postgres:16-alpine
    container_name: oism_postgres
    environment:
      POSTGRES_DB: oism_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - oism_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oism_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: oism_backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      OISM_DB_URL: jdbc:postgresql://postgres:5432/oism_db
      OISM_DB_USER: postgres
      OISM_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # Khoa chi dung de dev/demo (>= 32 byte). Moi truong that phai dat OISM_JWT_SECRET rieng.
      OISM_JWT_SECRET: ${OISM_JWT_SECRET:-docker-dev-secret-change-me-0123456789-abcdef}
      OISM_CORS_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:5173
      # true: nap 2 tenant mau (owner.a@oism.vn / owner.b@oism.vn, mat khau Oism@12345). Chi dung dev/demo.
      OISM_SEED_ENABLED: ${OISM_SEED_ENABLED:-false}
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend-admin:
    build:
      context: ./frontend-admin
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
    container_name: oism_frontend_admin
    profiles: [frontend]
    depends_on:
      - backend
    ports:
      - "3000:80"
    restart: unless-stopped

  frontend-pos:
    build:
      context: ./frontend-pos
      args:
        VITE_API_URL: http://localhost:8080/api/v1
    container_name: oism_frontend_pos
    profiles: [frontend]
    depends_on:
      - backend
    ports:
      - "3001:80"
    restart: unless-stopped

volumes:
  oism_pgdata:
